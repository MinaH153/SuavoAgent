name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bootstrap-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse bootstrap.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content -Raw -LiteralPath .\bootstrap.ps1
          $null = [scriptblock]::Create($source)
          $parseErrors = $null
          [System.Management.Automation.PSParser]::Tokenize($source, [ref]$parseErrors) | Out-Null
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String | Write-Host
            throw "bootstrap.ps1 has Windows PowerShell 5.1 parse errors"
          }

      - name: Parse operator update scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          # upgrade.ps1 + install.ps1 both write the H-8 binaries.manifest; a parse
          # error there silently ships a broken deploy/update path (no app builds it).
          foreach ($script in @('.\upgrade.ps1', '.\install.ps1')) {
            $source = Get-Content -Raw -LiteralPath $script
            $null = [scriptblock]::Create($source)
            $parseErrors = $null
            [System.Management.Automation.PSParser]::Tokenize($source, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | Format-List * | Out-String | Write-Host
              throw "$script has Windows PowerShell 5.1 parse errors"
            }
          }

      - name: Parse and run no-PHI release probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -Raw -LiteralPath .\scripts\Test-SuavoAgentReleaseProbe.ps1
          $null = [scriptblock]::Create($source)
          $parseErrors = $null
          [System.Management.Automation.PSParser]::Tokenize($source, [ref]$parseErrors) | Out-Null
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String | Write-Host
            throw "Test-SuavoAgentReleaseProbe.ps1 has Windows PowerShell 5.1 parse errors"
          }

          $probeDir = Join-Path $env:RUNNER_TEMP 'suavoagent-release-probe'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          foreach ($binary in @(
            'SuavoAgent.Core.exe',
            'SuavoAgent.Broker.exe',
            'SuavoAgent.Helper.exe',
            'SuavoAgent.Watchdog.exe',
            'SuavoSetup.exe'
          )) {
            Set-Content -LiteralPath (Join-Path $probeDir $binary) -Value 'stub' -Encoding ASCII
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-SuavoAgentReleaseProbe.ps1 -Mode ReleaseArtifact -ReleaseDir $probeDir -BootstrapPath .\bootstrap.ps1 -Json

  build-and-test:
    runs-on: ubuntu-latest
    needs: bootstrap-windows-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Solution-level restore/build MUST NOT pass -r <RID>.
      # .NET SDK 8.0.400+ hard-errors on NETSDK1134 ("Building a solution with
      # a specific RuntimeIdentifier is not supported"). The RID only belongs
      # at publish time (see cross-compile job below). Tests don't need a RID.
      - name: Restore
        run: dotnet restore SuavoAgent.sln

      - name: Build
        run: dotnet build SuavoAgent.sln -c Release --no-restore

      - name: Test
        run: dotnet test SuavoAgent.sln -c Release --no-build -v normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"

  cross-compile:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Core (win-x64)
        run: dotnet publish src/SuavoAgent.Core -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/

      - name: Publish Broker (win-x64)
        run: dotnet publish src/SuavoAgent.Broker -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/

      - name: Publish Helper (win-x64)
        run: dotnet publish src/SuavoAgent.Helper -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/

      - name: Publish Setup (win-x64)
        run: dotnet publish src/SuavoAgent.Setup -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-binaries
          path: artifacts/*.exe

  windows-uia-smoke:
    name: windows-uia-smoke
    runs-on: windows-latest
    # Live UIA on a REAL app (Notepad) — the operational proof, in CI, that the perception +
    # signature-resolution + SendInput actuation stack works on a real window (not a SimulatedApp),
    # WITHOUT the production box. INFORMATIONAL (continue-on-error): UIA on hosted runners can be
    # session-sensitive, so this proves-when-it-can without gating merges; build-and-test stays the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Helper.Tests
        run: dotnet build tests/SuavoAgent.Helper.Tests/SuavoAgent.Helper.Tests.csproj -c Release

      # Classic-Win32 harness (WinForms) the production extractor CAN read — built only here (net8.0-windows
      # won't build on the ubuntu gate; it's deliberately out of the solution). The real-app test launches it.
      - name: Build UIA harness (classic Win32)
        run: dotnet build tests/SuavoAgent.UiaHarness/SuavoAgent.UiaHarness.csproj -c Release

      - name: Live-UIA real-Notepad smoke (perceive → resolve → type → read back)
        run: dotnet test tests/SuavoAgent.Helper.Tests/SuavoAgent.Helper.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~RealNotepadUiaTests" -v normal

      - name: Real-app loop on a classic-Win32 app (primitives + full AgenticLoopRunner → Done)
        env:
          SUAVOAGENT_UIA_HARNESS: ${{ github.workspace }}\tests\SuavoAgent.UiaHarness\bin\Release\net8.0-windows\SuavoAgent.UiaHarness.exe
        run: dotnet test tests/SuavoAgent.Helper.Tests/SuavoAgent.Helper.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~RealAppPerceptionTests|FullyQualifiedName~RealAppLoopTests" -v normal

      # Prove the Tier-2 on-device LLM reasons in CI: download a small real GGUF and run LLamaLocalInference
      # (llama.cpp via LLamaSharp, CPU) under its GBNF grammar. Cached so it only downloads once.
      - name: Cache GGUF model
        id: cache-gguf
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\tinyllama-q4.gguf
          key: gguf-tinyllama-1.1b-chat-v1.0-q4_k_m-v1

      - name: Download GGUF model (if not cached)
        if: steps.cache-gguf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Ungated, Apache-2.0 (no HF license wall). curl -L follows the HF CDN redirect; --fail surfaces HTTP errors.
          $url = "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
          curl.exe -L --fail --retry 3 -o "$env:RUNNER_TEMP\tinyllama-q4.gguf" $url
          $size = (Get-Item "$env:RUNNER_TEMP\tinyllama-q4.gguf").Length
          Write-Host "downloaded $size bytes"
          if ($size -lt 100000000) { throw "model download too small ($size bytes) — likely an HTML error page" }

      - name: Real local-LLM reasoning smoke (loads a GGUF → grammar-constrained action)
        env:
          SUAVOAGENT_TEST_GGUF: ${{ runner.temp }}\tinyllama-q4.gguf
        run: dotnet test tests/SuavoAgent.Helper.Tests/SuavoAgent.Helper.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~LocalLlmSmokeTests" -v normal

  agent-merge-gate:
    name: Agent Merge Gate
    runs-on: ubuntu-latest
    needs: [bootstrap-windows-smoke, build-and-test]
    if: always()
    steps:
      - name: Require agent checks before merge
        run: |
          if [[ "${{ needs.bootstrap-windows-smoke.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then exit 1; fi
