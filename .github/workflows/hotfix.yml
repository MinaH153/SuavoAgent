name: Hotfix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.1)'
        required: true
        type: string
      description:
        description: 'What this hotfix fixes'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release-signing-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require signed hotfix configuration
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
          CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_ENABLED" != "true" ]]; then
            echo "::error::SIGNING_ENABLED must be set to true before cutting a Queen/field hotfix."
            exit 1
          fi
          if [[ -z "$CERT_THUMBPRINT" ]]; then
            echo "::error::SIGNING_CERT_THUMBPRINT must be configured before cutting a Queen/field hotfix."
            exit 1
          fi

      - name: Verify GitHub sees an online signing runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNNER_COUNT="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status == "online" and (([.labels[].name | ascii_downcase] | index("self-hosted")) != null) and (([.labels[].name | ascii_downcase] | index("windows")) != null) and (([.labels[].name | ascii_downcase] | index("yubikey")) != null))] | length'
          )"
          if [[ "${RUNNER_COUNT:-0}" -lt 1 ]]; then
            echo "::error::No online self-hosted Windows Yubikey signing runner is registered. Register the signing PC runner and rerun before cutting a Queen/field hotfix."
            exit 1
          fi

  bootstrap-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse bootstrap.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content -Raw -LiteralPath .\bootstrap.ps1
          $null = [scriptblock]::Create($source)
          $parseErrors = $null
          [System.Management.Automation.PSParser]::Tokenize($source, [ref]$parseErrors) | Out-Null
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String | Write-Host
            throw "bootstrap.ps1 has Windows PowerShell 5.1 parse errors"
          }

  # --- Build unsigned binaries on Linux -----------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [release-signing-preflight, bootstrap-windows-smoke]
    outputs:
      version_numeric: ${{ steps.version.outputs.VERSION_NUMERIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate version format
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $INPUT_VERSION"
            exit 1
          fi
          VERSION_NUMERIC="${INPUT_VERSION#v}"
          echo "VERSION_NUMERIC=$VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Build + Test
        env:
          VERSION_NUMERIC: ${{ steps.version.outputs.VERSION_NUMERIC }}
        run: |
          dotnet build SuavoAgent.sln -c Release -p:Version="$VERSION_NUMERIC"
          dotnet test SuavoAgent.sln -c Release --no-build -v normal

      - name: Publish all binaries
        env:
          VERSION_NUMERIC: ${{ steps.version.outputs.VERSION_NUMERIC }}
        run: |
          for proj in Core Broker Helper Watchdog Setup; do
            dotnet publish src/SuavoAgent.$proj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version="$VERSION_NUMERIC" -o release/
          done

      - name: Upload unsigned binaries
        uses: actions/upload-artifact@v4
        with:
          name: suavoagent-hotfix-unsigned-${{ inputs.version }}
          path: release/
          retention-days: 7

  # --- Authenticode sign (gated by SIGNING_ENABLED) -----------------------
  sign_windows:
    if: ${{ vars.SIGNING_ENABLED == 'true' }}
    needs: build
    runs-on: [self-hosted, windows, yubikey]
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned binaries
        uses: actions/download-artifact@v4
        with:
          name: suavoagent-hotfix-unsigned-${{ inputs.version }}
          path: release

      - name: Verify signing runner readiness
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: .\scripts\Test-SigningRunnerReadiness.ps1 -ExpectedThumbprint $env:CERT_THUMBPRINT -Json

      - name: Sign binaries with signtool
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CERT_THUMBPRINT) {
            throw "Secret SIGNING_CERT_THUMBPRINT is not set. See docs/signing.md."
          }
          $ts = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://ts.ssl.com' }

          $candidates = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "${env:ProgramFiles}\Windows Kits\10\bin"
          ) | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Directory } | Sort-Object Name -Descending
          $signtool = $null
          foreach ($dir in $candidates) {
            $path = Join-Path $dir 'x64\signtool.exe'
            if (Test-Path $path) { $signtool = $path; break }
          }
          if (-not $signtool) { throw 'signtool.exe not found. Install Windows 10 SDK.' }
          Write-Host "Using signtool: $signtool"

          $targets = @(
            'release/SuavoAgent.Core.exe',
            'release/SuavoAgent.Broker.exe',
            'release/SuavoAgent.Helper.exe',
            'release/SuavoAgent.Watchdog.exe',
            'release/SuavoSetup.exe'
          )
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { throw "Missing binary: $t" }
            Write-Host "Signing $t"
            & $signtool sign /fd SHA256 /tr $ts /td SHA256 /sha1 $env:CERT_THUMBPRINT $t
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $t (exit $LASTEXITCODE)" }
            & $signtool verify /pa /v $t
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed on $t (exit $LASTEXITCODE)" }
          }

      - name: Upload signed binaries
        uses: actions/upload-artifact@v4
        with:
          name: suavoagent-hotfix-final-${{ inputs.version }}
          path: release/
          retention-days: 7

  # --- Windows hotfix artifact smoke --------------------------------------
  windows-release-smoke:
    needs: [build, sign_windows]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.sign_windows.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download final binaries
        uses: actions/download-artifact@v4
        with:
          name: suavoagent-hotfix-final-${{ inputs.version }}
          path: release

      - name: Build hotfix release zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "suavoagent-${{ inputs.version }}-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $binaries = Get-ChildItem -LiteralPath release -Filter *.exe -File
          if (-not $binaries -or $binaries.Count -eq 0) {
            throw "No hotfix binaries found to zip"
          }
          $binaries | Compress-Archive -DestinationPath $zip -Force

      - name: Expand zip and run no-PHI hotfix release probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "suavoagent-${{ inputs.version }}-win-x64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP 'suavoagent-hotfix-expanded'
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          New-Item -ItemType Directory -Path $expanded -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-SuavoAgentReleaseProbe.ps1 -Mode ReleaseArtifact -ReleaseDir $expanded -BootstrapPath .\bootstrap.ps1 -RequireAuthenticodeSignature -Json

      - name: Upload smoked hotfix release zip
        uses: actions/upload-artifact@v4
        with:
          name: suavoagent-hotfix-smoked-zip-${{ inputs.version }}
          path: suavoagent-${{ inputs.version }}-win-x64.zip
          retention-days: 7

  # --- Tag + checksums + manifest + release -------------------------------
  release:
    needs: [build, sign_windows, windows-release-smoke]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.sign_windows.result == 'success' &&
      needs.windows-release-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download final binaries
        uses: actions/download-artifact@v4
        with:
          name: suavoagent-hotfix-final-${{ inputs.version }}
          path: release

      - name: Download smoked hotfix release zip
        uses: actions/download-artifact@v4
        with:
          name: suavoagent-hotfix-smoked-zip-${{ inputs.version }}
          path: release

      - name: Generate field release receipt
        env:
          VERSION: ${{ inputs.version }}
          VERSION_NUMERIC: ${{ needs.build.outputs.version_numeric }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          ZIP="suavoagent-${VERSION}-win-x64.zip"
          ZIP_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          ROLLBACK_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != env.VERSION)][0].tagName // ""')"
          if [[ -z "$ROLLBACK_TAG" ]]; then
            echo "::error::No previous non-prerelease release found for rollback."
            exit 1
          fi
          ROLLBACK_ZIP="suavoagent-${ROLLBACK_TAG}-win-x64.zip"
          ROLLBACK_TMP="$(mktemp -d)"
          gh release download "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.sha256 --dir "$ROLLBACK_TMP"
          ROLLBACK_SHA="$(awk -v zip="$ROLLBACK_ZIP" '$2 == zip {print $1}' "$ROLLBACK_TMP/checksums.sha256")"
          if [[ ! "$ROLLBACK_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Previous release $ROLLBACK_TAG does not expose a checksums.sha256 entry for $ROLLBACK_ZIP."
            exit 1
          fi
          export ZIP ZIP_SHA ROLLBACK_TAG ROLLBACK_ZIP ROLLBACK_SHA
          python3 - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          rollback_tag = os.environ["ROLLBACK_TAG"]
          receipt = {
              "releaseTag": version,
              "version": os.environ["VERSION_NUMERIC"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "artifact": os.environ["ZIP"],
              "artifactSha256": os.environ["ZIP_SHA"],
              "authenticode": "required-valid",
              "checksumSignature": "checksums.sha256.sig",
              "manifestSignature": f"update-manifest-{version}.sig",
              "track2QueenValidation": "do-not-run-against-older-tags",
              "rollbackArtifact": {
                  "releaseTag": rollback_tag,
                  "artifact": os.environ["ROLLBACK_ZIP"],
                  "artifactSha256": os.environ["ROLLBACK_SHA"],
                  "releaseUrl": (
                      "https://github.com/"
                      f"{os.environ['GITHUB_REPOSITORY']}/releases/download/{rollback_tag}/"
                      f"{os.environ['ROLLBACK_ZIP']}"
                  ),
              },
          }
          with open("field-release-receipt.json", "w", encoding="utf-8") as fh:
              json.dump(receipt, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

      - name: Generate + sign checksums
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_PEM }}
        run: |
          cd release
          sha256sum SuavoAgent.Core.exe SuavoAgent.Broker.exe SuavoAgent.Helper.exe SuavoAgent.Watchdog.exe SuavoSetup.exe suavoagent-${{ inputs.version }}-win-x64.zip field-release-receipt.json > checksums.sha256
          openssl dgst -sha256 -sign <(echo "$SIGNING_KEY") -out checksums.sha256.sig checksums.sha256

      - name: Generate + sign OTA update manifest
        env:
          VERSION: ${{ inputs.version }}
          VERSION_NUMERIC: ${{ needs.build.outputs.version_numeric }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          cd release
          CORE_SHA=$(sha256sum SuavoAgent.Core.exe | awk '{print $1}')
          BROKER_SHA=$(sha256sum SuavoAgent.Broker.exe | awk '{print $1}')
          HELPER_SHA=$(sha256sum SuavoAgent.Helper.exe | awk '{print $1}')
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          MANIFEST="${BASE_URL}/SuavoAgent.Core.exe|${CORE_SHA}|${BASE_URL}/SuavoAgent.Broker.exe|${BROKER_SHA}|${BASE_URL}/SuavoAgent.Helper.exe|${HELPER_SHA}|${VERSION_NUMERIC}|net8.0|win-x64"
          printf '%s' "$MANIFEST" > "update-manifest-${VERSION}.txt"
          DER_SIG="$(mktemp)"
          printf '%s' "$MANIFEST" | openssl dgst -sha256 -sign <(echo "$SIGNING_KEY") -out "$DER_SIG"
          python3 ../scripts/ecdsa_der_to_p1363.py "$DER_SIG" "update-manifest-${VERSION}.sig"
          test "$(wc -c < update-manifest-${VERSION}.sig)" -eq 128

      - name: Create tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git tag "$INPUT_VERSION"
          git push origin "$INPUT_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "${{ inputs.version }} — Hotfix"
          body: |
            ## Hotfix: ${{ inputs.description }}

            Emergency release from hotfix pipeline.
            **Tests:** All passing before release.
            **Windows smoke:** Release zip expanded and passed no-PHI binary/bootstrap probe on windows-latest.
            **Source commit:** ${{ github.sha }}
            **Checksums:** ECDSA P-256 signed.
            **Authenticode:** Signed (Yubikey EV).
          files: |
            release/SuavoAgent.Core.exe
            release/SuavoAgent.Broker.exe
            release/SuavoAgent.Helper.exe
            release/SuavoAgent.Watchdog.exe
            release/SuavoSetup.exe
            release/suavoagent-*-win-x64.zip
            release/field-release-receipt.json
            release/checksums.sha256
            release/checksums.sha256.sig
            release/update-manifest-v*.txt
            release/update-manifest-v*.sig
