name: Hotfix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.1)'
        required: true
        type: string
      description:
        description: 'What this hotfix fixes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: suavoagent-production-release
  cancel-in-progress: false

jobs:
  trusted-main-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require workflow_dispatch from the exact protected main tip
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REF_PROTECTED" == "true" ]]
          git fetch --no-tags origin main --depth=1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]

  release-signing-preflight:
    needs: trusted-main-source
    runs-on: ubuntu-latest
    environment: suavoagent-production-signing
    outputs:
      authenticode_signer_sha256: ${{ steps.signing-preflight.outputs.authenticode_signer_sha256 }}
      vc_redist_x64_url: ${{ steps.signing-preflight.outputs.vc_redist_x64_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Require eSigner cloud-signing configuration
        id: signing-preflight
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          AUTHENTICODE_SIGNER_SHA256: ${{ vars.AUTHENTICODE_SIGNER_SHA256 }}
          OTA_KMS_KEY_ID: ${{ vars.OTA_KMS_KEY_ID }}
          OTA_KMS_PUBLIC_KEY_DER_BASE64: ${{ vars.OTA_KMS_PUBLIC_KEY_DER_BASE64 }}
          AWS_SIGNING_ROLE_ARN: ${{ vars.AWS_SIGNING_ROLE_ARN }}
          AWS_SIGNING_REGION: ${{ vars.AWS_SIGNING_REGION }}
          OTA_FULL_COHORT_MANIFEST: ${{ vars.OTA_FULL_COHORT_MANIFEST }}
          WIX_OSMF_EULA_ACCEPTED: ${{ vars.WIX_OSMF_EULA_ACCEPTED }}
          VC_REDIST_X64_URL: ${{ vars.VC_REDIST_X64_URL }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_ENABLED" != "true" ]]; then
            echo "::error::SIGNING_ENABLED must be set to true before cutting a Queen/field hotfix."
            exit 1
          fi
          if [[ "$WIX_OSMF_EULA_ACCEPTED" != "true" ]]; then
            echo "::error::WIX_OSMF_EULA_ACCEPTED must be set to true by the legal owner before building the customer MSI."
            exit 1
          fi
          python3 scripts/v1_bridge_cli.py assert-normal-release \
            --full-cohort-manifest "$OTA_FULL_COHORT_MANIFEST" \
            --evidence security/ota-v1-bridge-convergence-evidence.json \
            --claim security/ota-v1-bridge-convergence-claim.json \
            --signature security/ota-v1-bridge-convergence-claim.sig
          missing=()
          for var in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET AUTHENTICODE_SIGNER_SHA256 OTA_KMS_KEY_ID OTA_KMS_PUBLIC_KEY_DER_BASE64 AWS_SIGNING_ROLE_ARN AWS_SIGNING_REGION OTA_FULL_COHORT_MANIFEST VC_REDIST_X64_URL; do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing release-signing secret(s): ${missing[*]}. See docs/signing.md."
            exit 1
          fi
          if [[ ! "$AUTHENTICODE_SIGNER_SHA256" =~ ^[A-Fa-f0-9]{64}(,[A-Fa-f0-9]{64}){0,15}$ ]]; then
            echo "::error::AUTHENTICODE_SIGNER_SHA256 must contain 1-16 exact SHA-256 certificate digests."
            exit 1
          fi
          if [[ ! "$VC_REDIST_X64_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::VC_REDIST_X64_URL must be an HTTPS location for the reviewed 14.44.35211.0 x64 prerequisite."
            exit 1
          fi
          if [[ "$AWS_SIGNING_ROLE_ARN" != "arn:aws:iam::855763870758:role/github-actions/SuavoAgentProductionOtaSigningV2" ]]; then
            echo "::error::AWS_SIGNING_ROLE_ARN is not the exact reviewed v2 signing role."
            exit 1
          fi
          if [[ "$AWS_SIGNING_REGION" != "us-east-1" ]]; then
            echo "::error::AWS_SIGNING_REGION must be exactly us-east-1."
            exit 1
          fi
          if [[ "$OTA_KMS_KEY_ID" != "arn:aws:kms:us-east-1:855763870758:key/44bd84dc-8f6d-4692-b8ba-40a026db0331" ]]; then
            echo "::error::OTA_KMS_KEY_ID is not the exact reviewed v2 signing key."
            exit 1
          fi
          python3 scripts/ota_update_trust_roots.py validate --require-key-id ota-update-v2
          python3 scripts/ota_update_trust_roots.py assert-signing-public-key "$OTA_KMS_PUBLIC_KEY_DER_BASE64"
          printf 'authenticode_signer_sha256=%s\nvc_redist_x64_url=%s\n' \
            "$AUTHENTICODE_SIGNER_SHA256" "$VC_REDIST_X64_URL" >> "$GITHUB_OUTPUT"

  production-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Enforce native production and customer boundary
        run: bash scripts/verify-production-shell-boundary.sh

  # Manual dispatch does not waive platform proof: the exact selected main SHA
  # must pass the complete Windows suite before any hotfix artifact is built,
  # signed, attested, tagged, or published.
  full-windows-suite:
    name: Full Windows suite (exact hotfix SHA)
    runs-on: windows-latest
    needs: production-shell-boundary
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout is the hotfix SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = '${{ github.sha }}'.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Hotfix checkout mismatch: expected $expected, got $actual"
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.128

      - name: Restore exact locked graph
        shell: pwsh
        run: |
          dotnet restore SuavoAgent.sln --locked-mode -p:ContinuousIntegrationBuild=true
          foreach ($project in @('Core', 'Broker', 'Helper', 'Watchdog', 'Setup')) {
            dotnet restore "src/SuavoAgent.$project" -r win-x64 --locked-mode -p:ContinuousIntegrationBuild=true
          }

      - name: Build exact hotfix SHA
        run: dotnet build SuavoAgent.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run complete Windows regression suite
        run: >-
          dotnet test SuavoAgent.sln -c Release --no-build -v normal
          --logger "trx;LogFilePrefix=hotfix-windows-tests"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/windows
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.DeterministicReport=true

      - name: Upload exact-SHA Windows test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hotfix-windows-tests-${{ github.sha }}
          path: |
            TestResults/windows/**/*.trx
            TestResults/windows/**/coverage.cobertura.xml
          if-no-files-found: error

  # --- Build unsigned binaries on Linux -----------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [release-signing-preflight, production-shell-boundary, full-windows-suite]
    outputs:
      version_numeric: ${{ steps.version.outputs.VERSION_NUMERIC }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.128

      - name: Validate version format
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Hotfix version must be canonical vMAJOR.MINOR.PATCH with no leading zeros."
            exit 1
          fi
          VERSION_NUMERIC="${INPUT_VERSION#v}"
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION_NUMERIC"
          if (( 10#$VERSION_MAJOR > 255 || 10#$VERSION_MINOR > 255 || 10#$VERSION_PATCH > 65535 )); then
            echo "::error::Hotfix version is outside Windows Installer's 255.255.65535 product-version boundary."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Hotfix signing must run from the reviewed main branch."
            exit 1
          fi
          git fetch --no-tags origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-history.json
          python3 scripts/v1_bridge_run_metadata.py assert-version-newest \
            --releases release-history.json --version "$INPUT_VERSION"
          python3 scripts/v1_bridge_run_metadata.py assert-release-absent \
            --releases release-history.json --version "$INPUT_VERSION"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$INPUT_VERSION" >/dev/null 2>&1
          tag_status=$?
          set -e
          [[ $tag_status -eq 2 ]] || { echo "::error::Hotfix tag exists or absence could not be proven."; exit 1; }
          echo "VERSION_NUMERIC=$VERSION_NUMERIC" >> "$GITHUB_OUTPUT"

      - name: Build + Test
        env:
          VERSION_NUMERIC: ${{ steps.version.outputs.VERSION_NUMERIC }}
          AUTHENTICODE_SIGNER_SHA256: ${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}
        run: |
          dotnet restore SuavoAgent.sln --locked-mode -p:ContinuousIntegrationBuild=true
          for proj in Core Broker Helper Watchdog Setup; do
            dotnet restore "src/SuavoAgent.$proj" -r win-x64 --locked-mode -p:ContinuousIntegrationBuild=true
          done
          python3 scripts/verify-release-trust-inputs.py --trust-phase normal-v2
          python3 scripts/generate-release-legal-bundle.py --check --require-release-eligible
          python3 scripts/verify-external-release-assets.py
          python3 -m unittest \
            tests/test_aggregate_coverage.py \
            tests/test_installer_rehearsal_script.py \
            tests/test_resolve_release_rollback_evidence.py \
            tests/test_release_workflow_gates.py \
            -v
          dotnet build SuavoAgent.sln -c Release --no-restore -p:Version="$VERSION_NUMERIC" -p:AuthenticodeSignerSha256="$AUTHENTICODE_SIGNER_SHA256" -p:ContinuousIntegrationBuild=true
          dotnet test SuavoAgent.sln -c Release --no-build -v normal \
            --collect "XPlat Code Coverage" \
            --results-directory TestResults/coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.DeterministicReport=true
          python3 scripts/aggregate_coverage.py TestResults/coverage \
            --require-all-projects \
            --json TestResults/linux-coverage-summary.json

      - name: Upload exact-SHA Linux coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hotfix-linux-coverage-${{ github.sha }}
          path: TestResults/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Publish all binaries
        env:
          VERSION_NUMERIC: ${{ steps.version.outputs.VERSION_NUMERIC }}
          AUTHENTICODE_SIGNER_SHA256: ${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}
        run: |
          for proj in Core Broker Helper Watchdog Setup; do
            dotnet restore src/SuavoAgent.$proj -r win-x64 --locked-mode -p:ContinuousIntegrationBuild=true
            dotnet publish src/SuavoAgent.$proj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version="$VERSION_NUMERIC" -p:AuthenticodeSignerSha256="$AUTHENTICODE_SIGNER_SHA256" -p:ContinuousIntegrationBuild=true --no-restore -o release/
          done
          mkdir -p release/legal/license-texts release/legal/evidence
          cp src/SuavoAgent.Setup/Legal/THIRD-PARTY-NOTICES.txt release/legal/
          cp legal/THIRD-PARTY-PROVENANCE.json legal/external-assets.json release/legal/
          cp legal/license-texts/*.txt release/legal/license-texts/
          cp legal/evidence/*.json release/legal/evidence/

      - name: Upload unsigned binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-hotfix-unsigned-${{ inputs.version }}
          path: release/
          retention-days: 7

  production-coverage:
    name: Production cross-platform coverage (exact hotfix SHA)
    runs-on: ubuntu-latest
    needs: [build, full-windows-suite]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download exact-SHA Linux coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hotfix-linux-coverage-${{ github.sha }}
          path: TestResults/combined/linux

      - name: Download exact-SHA Windows coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hotfix-windows-tests-${{ github.sha }}
          path: TestResults/combined/windows

      - name: Enforce production coverage across both operating systems
        run: |
          python3 -m unittest \
            tests/test_aggregate_coverage.py \
            tests/test_installer_rehearsal_script.py \
            tests/test_resolve_release_rollback_evidence.py \
            tests/test_release_workflow_gates.py \
            -v
          python3 scripts/aggregate_coverage.py TestResults/combined \
            --require-all-projects \
            --minimum-line 80 \
            --minimum-branch 80 \
            --json TestResults/production-coverage-summary.json

      - name: Upload production coverage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hotfix-production-coverage-${{ github.sha }}
          path: TestResults/production-coverage-summary.json
          if-no-files-found: error

  # --- Authenticode sign via SSL.com eSigner cloud HSM --------------------
  sign_windows:
    needs: [build, full-windows-suite, production-coverage]
    runs-on: ubuntu-latest
    environment: suavoagent-production-signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download unsigned binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-hotfix-unsigned-${{ inputs.version }}
          path: release

      - name: Prepare signed output directory
        run: mkdir -p "${{ github.workspace }}/release/signed"

      - name: Set up verified eSigner Java runtime
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '11.0.31+11'
          verify-signature: true

      - name: Sign exact executable cohort with verified CodeSignTool
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REF_PROTECTED" == "true" ]]
          git fetch --no-tags origin main --depth=1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          scripts/esigner-codesign-hardened.sh release/signed \
            release/SuavoAgent.Core.exe release/SuavoAgent.Broker.exe \
            release/SuavoAgent.Helper.exe release/SuavoAgent.Watchdog.exe \
            release/SuavoSetup.exe

      - name: Preserve reviewed legal and provenance bundle
        run: |
          cp -R release/legal release/signed/legal
          cp release/appsettings.json release/signed/appsettings.json

      - name: Generate exact signed-cohort SPDX SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/generate-release-sbom.py --release-dir release/signed --version "$VERSION" --source-commit "$GITHUB_SHA" --output release/signed/suavoagent.spdx.json

      - name: Upload signed binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-final-${{ inputs.version }}
          path: release/signed/
          retention-days: 7

  # Build the native MSI from the exact signed five-binary cohort. Raw Setup is
  # retained only as an internal signed maintenance payload for OTA operations.
  build_msi:
    needs: [release-signing-preflight, build, sign_windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.128

      - name: Download exact signed cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-final-${{ inputs.version }}
          path: release

      - name: Assemble immutable MSI payload layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = '${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}'.Split(',') | ForEach-Object { $_.ToUpperInvariant() }
          $signedExecutables = @(
            'SuavoAgent.Core.exe',
            'SuavoAgent.Broker.exe',
            'SuavoAgent.Helper.exe',
            'SuavoAgent.Watchdog.exe',
            'SuavoSetup.exe'
          )
          foreach ($name in $signedExecutables) {
            $path = Join-Path release $name
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Signed MSI cohort member failed Authenticode validation: $name ($($signature.Status))."
            }
            $actual = $signature.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToUpperInvariant()
            if ($actual -notin $allowed) { throw "Signed MSI cohort member has an unapproved publisher: $name." }
          }
          foreach ($directory in @('Core', 'Broker', 'Helper', 'Watchdog', 'Setup')) {
            New-Item -ItemType Directory -Path "payload/$directory" -Force | Out-Null
          }
          Copy-Item release/SuavoAgent.Core.exe payload/Core/SuavoAgent.Core.exe
          Copy-Item release/SuavoAgent.Broker.exe payload/Broker/SuavoAgent.Broker.exe
          Copy-Item release/SuavoAgent.Helper.exe payload/Helper/SuavoAgent.Helper.exe
          Copy-Item release/SuavoAgent.Watchdog.exe payload/Watchdog/SuavoAgent.Watchdog.exe
          Copy-Item release/SuavoSetup.exe payload/Setup/SuavoSetup.exe
          Copy-Item release/appsettings.json payload/Core/appsettings.json

      - name: Restore locked WiX graph and build MSI
        shell: pwsh
        env:
          VERSION_NUMERIC: ${{ needs.build.outputs.version_numeric }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore installer/SuavoAgent.Msi/SuavoAgent.Msi.wixproj --locked-mode
          $epoch = [long](git show -s --format=%ct $env:GITHUB_SHA)
          $timestamp = [DateTimeOffset]::FromUnixTimeSeconds($epoch).UtcDateTime.ToString('yyyy-MM-ddTHH:mm:ss.fffffff+00:00')
          dotnet build installer/SuavoAgent.Msi/SuavoAgent.Msi.wixproj `
            -c Release --no-restore `
            -p:AcceptEula=wix7 `
            -p:SuavoAgentVersion=$env:VERSION_NUMERIC `
            -p:InstallerMetadataTimestampUtc=$timestamp `
            -p:PayloadRoot="$env:GITHUB_WORKSPACE/payload" `
            -p:ContinuousIntegrationBuild=true
          $candidates = @(Get-ChildItem installer/SuavoAgent.Msi/bin -Recurse -Filter SuavoAgent.msi -File)
          if ($candidates.Count -ne 1) { throw "Expected one MSI output, found $($candidates.Count)." }
          New-Item -ItemType Directory -Path msi -Force | Out-Null
          Copy-Item $candidates[0].FullName "msi/SuavoAgent-$env:VERSION-win-x64.msi"

      - name: Upload unsigned MSI for protected signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-hotfix-msi-unsigned-${{ inputs.version }}
          path: msi/*.msi
          retention-days: 1

  sign_msi:
    needs: [release-signing-preflight, build, build_msi]
    runs-on: ubuntu-latest
    environment: suavoagent-production-signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download unsigned MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-hotfix-msi-unsigned-${{ inputs.version }}
          path: msi

      - name: Prepare signed MSI directory
        run: mkdir -p "${{ github.workspace }}/msi/signed"

      - name: Set up verified eSigner Java runtime
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '11.0.31+11'
          verify-signature: true

      - name: Sign MSI with verified CodeSignTool
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REF_PROTECTED" == "true" ]]
          git fetch --no-tags origin main --depth=1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          scripts/esigner-codesign-hardened.sh msi/signed \
            "msi/SuavoAgent-${{ inputs.version }}-win-x64.msi"

      - name: Upload signed customer MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-msi-${{ inputs.version }}
          path: msi/signed/*.msi
          retention-days: 7

  # Burn embeds the already-signed MSI and the exact hash-pinned VC++ runtime.
  # Project references remain disabled so signed bytes cannot be rebuilt here.
  build_bundle:
    needs: [release-signing-preflight, build, sign_windows, sign_msi]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.128

      - name: Download signed MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-msi-${{ inputs.version }}
          path: signed-msi

      - name: Download exact signed cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-final-${{ inputs.version }}
          path: release

      - name: Stage signed MSI and reviewed prerequisite
        shell: pwsh
        env:
          VC_REDIST_X64_URL: ${{ needs.release-signing-preflight.outputs.vc_redist_x64_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem signed-msi -Filter *.msi -File)
          if ($msi.Count -ne 1) { throw "Expected one signed MSI, found $($msi.Count)." }
          & .\scripts\Test-InstallerAuthenticode.ps1 -Path $msi[0].FullName `
            -AllowedSignerSha256 '${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}'
          $signature = Get-AuthenticodeSignature -LiteralPath $msi[0].FullName
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) { throw "Embedded MSI signature is not valid." }
          $allowed = '${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}'.Split(',') | ForEach-Object { $_.ToUpperInvariant() }
          $actualSigner = $signature.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToUpperInvariant()
          if ($actualSigner -notin $allowed) { throw "Embedded MSI signer is outside the approved publisher set." }
          New-Item -ItemType Directory -Path installer/SuavoAgent.Msi/bin/x64/Release -Force | Out-Null
          Copy-Item $msi[0].FullName installer/SuavoAgent.Msi/bin/x64/Release/SuavoAgent.msi
          Invoke-WebRequest -Uri $env:VC_REDIST_X64_URL -OutFile vc_redist.x64.exe -MaximumRedirection 3
          $expected = 'cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b'
          $actual = (Get-FileHash vc_redist.x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "VC++ prerequisite hash does not match the reviewed artifact." }

      - name: Restore locked WiX graph and build Burn bundle
        shell: pwsh
        env:
          VERSION_NUMERIC: ${{ needs.build.outputs.version_numeric }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore installer/SuavoAgent.Bundle/SuavoAgent.Bundle.wixproj --locked-mode
          $epoch = [long](git show -s --format=%ct $env:GITHUB_SHA)
          $timestamp = [DateTimeOffset]::FromUnixTimeSeconds($epoch).UtcDateTime.ToString('yyyy-MM-ddTHH:mm:ss.fffffff+00:00')
          dotnet build installer/SuavoAgent.Bundle/SuavoAgent.Bundle.wixproj `
            -c Release --no-restore `
            -p:AcceptEula=wix7 `
            -p:BuildProjectReferences=false `
            -p:SuavoAgentVersion=$env:VERSION_NUMERIC `
            -p:InstallerMetadataTimestampUtc=$timestamp `
            -p:PayloadRoot="$env:GITHUB_WORKSPACE/release" `
            -p:VCRedistPath="$env:GITHUB_WORKSPACE/vc_redist.x64.exe" `
            -p:ContinuousIntegrationBuild=true
          $candidates = @(Get-ChildItem installer/SuavoAgent.Bundle/bin -Recurse -Filter SuavoAgent-Setup.exe -File)
          if ($candidates.Count -ne 1) { throw "Expected one Burn output, found $($candidates.Count)." }
          New-Item -ItemType Directory -Path bundle -Force | Out-Null
          Copy-Item $candidates[0].FullName "bundle/SuavoAgent-Setup.exe"

      - name: Upload unsigned bundle for protected signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-hotfix-bundle-unsigned-${{ inputs.version }}
          path: bundle/*.exe
          retention-days: 1

  sign_bundle:
    needs: [release-signing-preflight, build, build_bundle]
    runs-on: ubuntu-latest
    environment: suavoagent-production-signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download unsigned Burn bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-hotfix-bundle-unsigned-${{ inputs.version }}
          path: bundle

      - name: Prepare signed bundle directory
        run: mkdir -p "${{ github.workspace }}/bundle/signed"

      - name: Set up verified eSigner Java runtime
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '11.0.31+11'
          verify-signature: true

      - name: Sign customer bundle with verified CodeSignTool
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REF_PROTECTED" == "true" ]]
          git fetch --no-tags origin main --depth=1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          scripts/esigner-codesign-hardened.sh bundle/signed bundle/SuavoAgent-Setup.exe

      - name: Upload signed customer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-bundle-${{ inputs.version }}
          path: bundle/signed/*.exe
          retention-days: 7

  # --- Windows hotfix artifact smoke --------------------------------------
  windows-release-smoke:
    needs: [release-signing-preflight, build, sign_windows, sign_msi, sign_bundle]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.sign_windows.result == 'success' &&
      needs.sign_msi.result == 'success' &&
      needs.sign_bundle.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download final binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-final-${{ inputs.version }}
          path: release

      - name: Download signed customer MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-msi-${{ inputs.version }}
          path: installer-smoke

      - name: Download signed customer bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: suavoagent-bundle-${{ inputs.version }}
          path: bundle-smoke

      - name: Build hotfix release zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "suavoagent-${{ inputs.version }}-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $binaries = Get-ChildItem -LiteralPath release -Filter *.exe -File
          if (-not $binaries -or $binaries.Count -eq 0) {
            throw "No hotfix binaries found to zip"
          }
          Compress-Archive -Path (Join-Path release '*') -DestinationPath $zip -Force

      - name: Expand zip and run no-PHI hotfix release probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "suavoagent-${{ inputs.version }}-win-x64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP 'suavoagent-hotfix-expanded'
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          New-Item -ItemType Directory -Path $expanded -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-SuavoAgentReleaseProbe.ps1 -Mode ReleaseArtifact -ReleaseDir $expanded -MaintenancePath (Join-Path $expanded 'SuavoSetup.exe') -AllowedSignerSha256 '${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}' -RequireAuthenticodeSignature -Json
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $expanded -DisableRemediation

      - name: Rehearse signed MSI install, repair, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem installer-smoke -Filter *.msi -File)
          if ($msi.Count -ne 1) { throw "Expected one signed MSI, found $($msi.Count)." }
          & .\scripts\Invoke-SuavoAgentInstallerRehearsal.ps1 `
            -InstallerKind Msi `
            -InstallerPath $msi[0].FullName `
            -MsiPath $msi[0].FullName `
            -ExpectedReleaseTag '${{ inputs.version }}' `
            -AllowedSignerSha256 '${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}' `
            -EvidenceDirectory 'installer-rehearsal-evidence/msi'
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $msi[0].FullName -DisableRemediation

      - name: Rehearse signed customer bundle install, repair, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem installer-smoke -Filter *.msi -File)
          if ($msi.Count -ne 1) { throw "Expected one signed MSI, found $($msi.Count)." }
          $bundle = @(Get-ChildItem bundle-smoke -Filter *.exe -File)
          if ($bundle.Count -ne 1) { throw "Expected one signed bundle, found $($bundle.Count)." }
          & .\scripts\Invoke-SuavoAgentInstallerRehearsal.ps1 `
            -InstallerKind Bundle `
            -InstallerPath $bundle[0].FullName `
            -MsiPath $msi[0].FullName `
            -ExpectedReleaseTag '${{ inputs.version }}' `
            -AllowedSignerSha256 '${{ needs.release-signing-preflight.outputs.authenticode_signer_sha256 }}' `
            -EvidenceDirectory 'installer-rehearsal-evidence/bundle'
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $bundle[0].FullName -DisableRemediation

      - name: Upload installer rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hotfix-installer-rehearsal-${{ inputs.version }}
          path: installer-rehearsal-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoked hotfix release zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suavoagent-hotfix-smoked-zip-${{ inputs.version }}
          path: suavoagent-${{ inputs.version }}-win-x64.zip
          retention-days: 7

  # --- Tag + checksums + manifest + release -------------------------------

  release:
    needs: [build, sign_windows, sign_msi, sign_bundle, windows-release-smoke]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.sign_windows.result == 'success' &&
      needs.sign_msi.result == 'success' &&
      needs.sign_bundle.result == 'success' &&
      needs.windows-release-smoke.result == 'success'
    uses: ./.github/workflows/production-release-signing.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
