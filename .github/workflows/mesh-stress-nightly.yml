name: Mesh Stress Nightly

# Nightly concurrent-swap stress test for the RulesetRuntime snapshot
# pattern (Comp 2.2 Wire refactor). Acceptance gate: 30s wall-clock storm
# with ZERO mixed-generation observations — the memory-model contract this
# test defends. Run nightly on Windows runners to amortise JIT warmup and
# expose memory-model regressions before they reach prod.
#
# NOTE: swap/read counts are LIVENESS floors, not throughput gates. Per-swap
# cost (fresh PhiScrubber + FingerprintComputer + guarded journal append) makes
# absolute throughput runner-bound — a 2-core hosted windows-latest sustains
# ~200-250 swaps/30s, not the ~10k a fast dev box hits. The old absolute-10k
# assert kept this nightly red every night regardless of correctness. True
# high-volume throughput validation is a tracked follow-up for dedicated
# (self-hosted, isolated-disk) hardware where the number is meaningful.
#
# PR CI runs the smoke variant (1s wall-clock, no Category trait) via
# mesh-required-check.yml. The Stress variant is gated on the
# MESH_STRESS_NIGHTLY env var so it self-skips outside this workflow even
# if a runner happens to invoke the full test suite.
#
# CODEOWNERS entry: /.github/workflows/mesh-stress-*.yml @MinaH153
# (replace with @SuavoLLC/mesh-oncall when the team handle is created —
# round-7 LOW.)
#
# Failure handling:
#   - Single nightly failure → workflow red, no page (transient runner flake
#     possible under contention)
#   - 2 consecutive nightly failures → manual oncall investigation; consult
#     `docs/architecture/diagnostic-mesh-queen-first.md` §4 for the memory
#     model contract this test enforces

on:
  schedule:
    # 09:23 UTC ≈ 02:23 PT — runs before the daily PT engineering window.
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: RulesetRuntime concurrent-swap stress
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MESH_STRESS_NIGHTLY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/SuavoAgent.Diagnostics.Tests/SuavoAgent.Diagnostics.Tests.csproj

      - name: Build Release
        run: dotnet build tests/SuavoAgent.Diagnostics.Tests/SuavoAgent.Diagnostics.Tests.csproj --no-restore -c Release

      - name: Run Mesh stress suite
        run: dotnet test tests/SuavoAgent.Diagnostics.Tests/SuavoAgent.Diagnostics.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~Stress_Concurrent_swap_storm" --logger "console;verbosity=detailed" --logger "trx;LogFileName=stress.trx"

      - name: Upload TRX on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-trx
          path: |
            tests/SuavoAgent.Diagnostics.Tests/TestResults/*.trx
          retention-days: 14
