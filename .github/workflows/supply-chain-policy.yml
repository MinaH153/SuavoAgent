name: Supply-chain policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject floating or unapproved actions
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          approved_owners = {"actions", "aws-actions", "github", "softprops", "sslcom"}
          remote_use = re.compile(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)", re.MULTILINE)
          sha_pin = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          failures = []

          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              source = workflow.read_text(encoding="utf-8")
              if "pull_request" + "_target:" in source:
                  failures.append(f"{workflow}: pull_request_target is prohibited")
              if re.search(r"^\s*permissions:\s*write-all\s*$", source, re.MULTILINE):
                  failures.append(f"{workflow}: permissions write-all is prohibited")
              for reference in remote_use.findall(source):
                  if reference.startswith(("./", "docker://")):
                      continue
                  owner = reference.split("/", 1)[0].lower()
                  if owner not in approved_owners:
                      failures.append(f"{workflow}: unapproved action owner in {reference}")
                  if not sha_pin.fullmatch(reference):
                      failures.append(f"{workflow}: action is not pinned to a full SHA: {reference}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("All workflow actions are allowlisted and pinned to immutable SHAs.")
